<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000" fill="none">
    <defs>
        <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1D3B2A"/>
            <stop offset="60%" stop-color="#0F2A1D"/>
            <stop offset="100%" stop-color="#08140E"/>
        </linearGradient>
        <linearGradient id="warmLight" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%" stop-color="#D3B98C" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#0F2A1D" stop-opacity="0"/>
        </linearGradient>
        <clipPath id="hMask">
            <!-- Distinctive H-building architectural cut -->
            <rect x="60" y="80" width="780" height="840" rx="40"/>
        </clipPath>
    </defs>

    <!-- Background card -->
    <rect width="900" height="1000" rx="48" fill="url(#heroBg)"/>

    <g clip-path="url(#hMask)">
        <!-- Warm ambient ceiling glow -->
        <circle cx="450" cy="180" r="320" fill="url(#warmLight)"/>

        <!-- Architectural Glass Mullions & H-Structure Lines -->
        <line x1="280" y1="80" x2="280" y2="920" stroke="#FAF7F0" stroke-opacity="0.12" stroke-width="3"/>
        <line x1="620" y1="80" x2="620" y2="920" stroke="#FAF7F0" stroke-opacity="0.12" stroke-width="3"/>
        <line x1="60" y1="500" x2="840" y2="500" stroke="#FAF7F0" stroke-opacity="0.15" stroke-width="3"/>

        <!-- Abstract H-Building Architectural Silhouette -->
        <!-- Left Wing: Indoor Focus (Clean geometry) -->
        <rect x="120" y="240" width="180" height="520" rx="20" fill="#1D3B2A" stroke="#FAF7F0" stroke-opacity="0.2" stroke-width="2"/>
        <rect x="140" y="280" width="140" height="140" rx="12" fill="#FAF7F0" fill-opacity="0.08"/>
        <rect x="140" y="440" width="140" height="140" rx="12" fill="#FAF7F0" fill-opacity="0.08"/>
        <text x="210" y="660" font-family="'Instrument Sans', sans-serif" font-size="14" font-weight="600" fill="#A8BBA2" text-anchor="middle" letter-spacing="1">SAYAP INDOOR</text>
        <text x="210" y="685" font-family="'Instrument Sans', sans-serif" font-size="12" fill="#FAF7F0" fill-opacity="0.6" text-anchor="middle">AC &amp; Ruang Fokus</text>

        <!-- Central Link Bar: Barista & Order Bar -->
        <rect x="300" y="450" width="300" height="100" fill="#0F2A1D" stroke="#D3B98C" stroke-opacity="0.4" stroke-width="2"/>
        <text x="450" y="495" font-family="'Fraunces', Georgia, serif" font-size="18" font-weight="700" fill="#D3B98C" text-anchor="middle">BARISTA &amp; BREW BAR</text>
        <text x="450" y="520" font-family="'Instrument Sans', sans-serif" font-size="11" fill="#FAF7F0" fill-opacity="0.6" text-anchor="middle">Titik Temu Tengah</text>

        <!-- Right Wing: Outdoor Street Food (Vibrant) -->
        <rect x="600" y="240" width="180" height="520" rx="20" fill="#1D3B2A" stroke="#FAF7F0" stroke-opacity="0.2" stroke-width="2"/>
        <circle cx="690" cy="350" r="48" fill="#D3B98C" fill-opacity="0.15" stroke="#D3B98C" stroke-opacity="0.4"/>
        <path d="M660 350 L720 350 M690 320 L690 380" stroke="#D3B98C" stroke-width="2"/>
        <text x="690" y="660" font-family="'Instrument Sans', sans-serif" font-size="14" font-weight="600" fill="#D3B98C" text-anchor="middle" letter-spacing="1">SAYAP OUTDOOR</text>
        <text x="690" y="685" font-family="'Instrument Sans', sans-serif" font-size="12" fill="#FAF7F0" fill-opacity="0.6" text-anchor="middle">Street Food &amp; Senja</text>

        <!-- Campus Greenery Accents -->
        <path d="M60 880 Q250 820 450 860 Q650 900 840 840 L840 920 L60 920 Z" fill="#091A12"/>
        <circle cx="160" cy="850" r="30" fill="#3E5C45" fill-opacity="0.5"/>
        <circle cx="740" cy="830" r="40" fill="#3E5C45" fill-opacity="0.4"/>
    </g>

    <!-- Subtle Border Accent -->
    <rect x="1.5" y="1.5" width="897" height="997" rx="46.5" stroke="#FAF7F0" stroke-opacity="0.15" stroke-width="3"/>
</svg>
