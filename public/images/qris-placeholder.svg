  <text x="246" y="40" font-family="sans-serif" font-weight="700" font-size="11" fill="#EFC94C" text-anchor="end">STATIS</text>

  <!-- Matrix area 180x180 centered at x=50 y=72 -->
  <g transform="translate(50,72)" fill="#22263A">
