    <rect x="0" y="138" width="42" height="42" fill="none" stroke="#22263A" stroke-width="6"/>
    <rect x="12" y="150" width="18" height="18"/>

    <!-- Timing & deterministic QR pattern -->
    <rect x="54" y="6" width="12" height="12"/>
    <rect x="78" y="6" width="12" height="12"/>
    <rect x="102" y="6" width="12" height="12"/>
    <rect x="6" y="54" width="12" height="12"/>
    <rect x="6" y="78" width="12" height="12"/>
    <rect x="6" y="102" width="12" height="12"/>

    <rect x="54" y="30" width="18" height="12"/>
    <rect x="84" y="30" width="12" height="24"/>
    <rect x="108" y="30" width="18" height="12"/>

    <rect x="30" y="54" width="18" height="18"/>
    <rect x="60" y="54" width="12" height="12"/>
    <rect x="84" y="66" width="24" height="12"/>
    <rect x="120" y="54" width="18" height="12"/>
    <rect x="150" y="54" width="18" height="24"/>

    <rect x="30" y="84" width="12" height="24"/>
    <rect x="54" y="78" width="18" height="18"/>
    <rect x="96" y="84" width="12" height="18"/>
    <rect x="120" y="78" width="24" height="12"/>
    <rect x="162" y="84" width="18" height="12"/>

    <rect x="54" y="108" width="12" height="18"/>
    <rect x="78" y="108" width="24" height="12"/>
    <rect x="114" y="102" width="18" height="18"/>
    <rect x="144" y="108" width="12" height="18"/>
    <rect x="168" y="108" width="12" height="24"/>

    <rect x="54" y="138" width="18" height="12"/>
    <rect x="84" y="132" width="12" height="24"/>
    <rect x="108" y="138" width="18" height="12"/>
    <rect x="138" y="138" width="18" height="18"/>
    <rect x="168" y="144" width="12" height="18"/>

    <rect x="66" y="162" width="24" height="18"/>
    <rect x="108" y="162" width="18" height="12"/>
    <rect x="138" y="168" width="12" height="12"/>
    <rect x="162" y="168" width="18" height="12"/>
