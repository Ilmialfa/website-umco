<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 320" width="280" height="320" role="img" aria-label="Contoh QRIS UMCO House">
  <rect width="280" height="320" rx="8" fill="#FCFBF7" stroke="#22263A" stroke-width="2"/>
  <rect x="20" y="18" width="240" height="34" rx="4" fill="#22263A"/>
