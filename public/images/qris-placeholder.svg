    <rect x="0" y="0" width="42" height="42" fill="none" stroke="#22263A" stroke-width="6"/>
    <rect x="12" y="12" width="18" height="18"/>
    <!-- Top-right finder -->
    <rect x="138" y="0" width="42" height="42" fill="none" stroke="#22263A" stroke-width="6"/>
    <rect x="150" y="12" width="18" height="18"/>
