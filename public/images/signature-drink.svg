<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
    <defs>
        <!-- Gradients for realistic artisan layered latte -->
        <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
            <stop offset="20%" stop-color="#ffffff" stop-opacity="0.1"/>
            <stop offset="80%" stop-color="#ffffff" stop-opacity="0.05"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25"/>
        </linearGradient>
        <linearGradient id="condensedMilk" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#F7EEDD"/>
            <stop offset="100%" stop-color="#EED9B3"/>
        </linearGradient>
        <linearGradient id="espressoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#2B1608"/>
            <stop offset="60%" stop-color="#4E2E16"/>
            <stop offset="100%" stop-color="#84532B"/>
        </linearGradient>
        <linearGradient id="cremaFoam" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFF9ED"/>
            <stop offset="100%" stop-color="#F2DFBF"/>
        </linearGradient>
        <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#000000" stop-opacity="0.45"/>
            <stop offset="70%" stop-color="#000000" stop-opacity="0.15"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>
        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
        </filter>
    </defs>

    <!-- Floor Cast Shadow -->
    <ellipse cx="200" cy="460" rx="140" ry="24" fill="url(#shadowGrad)"/>

    <!-- Glassware Group with drop shadow -->
    <g filter="url(#softShadow)">
        <!-- Layer 1: Condensed Milk / Fresh Milk at base -->
        <path d="M110 320 L125 435 Q128 445 140 445 L260 445 Q272 445 275 435 L290 320 Z" fill="url(#condensedMilk)"/>

        <!-- Layer 2: Swirling Caramel / Palm Sugar (Aren) Band -->
        <path d="M102 240 L110 325 Q150 335 200 320 Q250 305 290 325 L298 240 Q250 255 200 240 Q150 225 102 240 Z" fill="#8C4718"/>

        <!-- Layer 3: Rich Espresso Double Shot Layer -->
        <path d="M92 120 L102 245 Q150 260 200 245 Q250 230 298 245 L308 120 Z" fill="url(#espressoGrad)"/>

        <!-- Ice Cubes floating inside glass -->
        <rect x="135" y="160" width="55" height="50" rx="10" transform="rotate(-12 135 160)" fill="#FFFFFF" fill-opacity="0.25" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5"/>
        <rect x="210" y="195" width="52" height="48" rx="9" transform="rotate(18 210 195)" fill="#FFFFFF" fill-opacity="0.2" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5"/>
        <rect x="160" y="260" width="50" height="46" rx="8" transform="rotate(6 160 260)" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5"/>

        <!-- Layer 4: Microfoam Cream Top -->
        <path d="M88 80 Q85 120 92 125 Q145 138 200 138 Q255 138 308 125 Q315 120 312 80 Q310 65 200 65 Q90 65 88 80 Z" fill="url(#cremaFoam)"/>

        <!-- Dusting of Cocoa / Cinnamon on top -->
        <ellipse cx="200" cy="74" rx="90" ry="14" fill="#693716" fill-opacity="0.35"/>
        <circle cx="170" cy="72" r="1.5" fill="#3D1D09"/>
        <circle cx="185" cy="76" r="2" fill="#3D1D09"/>
        <circle cx="215" cy="73" r="1.5" fill="#3D1D09"/>
        <circle cx="230" cy="75" r="2" fill="#3D1D09"/>

        <!-- Glass Outline & Highlights -->
        <path d="M85 70 L122 436 Q126 448 140 448 L260 448 Q274 448 278 436 L315 70 Q318 55 200 55 Q82 55 85 70 Z" fill="url(#glassGrad)" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2"/>

        <!-- Glass Specular Vertical Highlight Strip -->
        <path d="M96 90 L128 425" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="5" stroke-linecap="round"/>
        <path d="M106 100 L134 380" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round"/>
    </g>
</svg>
