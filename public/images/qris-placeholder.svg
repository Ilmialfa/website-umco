  <line x1="20" y1="268" x2="260" y2="268" stroke="#22263A" stroke-opacity="0.2" stroke-dasharray="4 4"/>
  <text x="140" y="290" font-family="sans-serif" font-weight="600" font-size="11" fill="#22263A" text-anchor="middle">Contoh QRIS Sementara (atur di Admin)</text>
  <text x="140" y="306" font-family="sans-serif" font-size="10" fill="#22263A" fill-opacity="0.7" text-anchor="middle">Kampus 2 UMRI · Pekanbaru</text>
